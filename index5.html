<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #f393c3, #f7b6d5);
            font-family: "Georgia", serif;
            cursor: pointer;
        }

        /* =========================
           SERDUSZKA W TLE
        ========================= */

        .heart {
            position: absolute;
            bottom: -100px;
            background-image: url("serce-2.png");
            background-size: contain;
            background-repeat: no-repeat;
            opacity: 0.8;
            pointer-events: none;
            z-index: 1;
            animation: fly linear forwards;
        }

        .heart-burst {
            position: absolute;
            background-image: url("serce-2.png");
            background-size: contain;
            background-repeat: no-repeat;
            pointer-events: none;
            z-index: 1000;
        }

        @keyframes fly {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.8;
            }

            90% {
                opacity: 0.8;
            }

            100% {
                transform: translateY(-120vh) rotate(20deg);
                opacity: 0;
            }
        }


        /* =========================
           GŁÓWNY KONTENER
        ========================= */

        .container {
            position: relative;
            z-index: 10;

            width: min(900px, 92%);
            height: 100vh;

            margin: 0 auto;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            padding: 30px 0;
        }


        /* =========================
           GALERIA (PŁYNNE PRZENIKANIE)
        ========================= */

        .gallery {
            position: relative;

            width: min(650px, 90vw);
            height: min(65vh, 600px);

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 25px;

            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);

            box-shadow:
                0 20px 60px rgba(120, 30, 70, 0.25),
                inset 0 0 30px rgba(255, 255, 255, 0.15);

            overflow: hidden;
        }

        .photo {
            position: absolute;

            max-width: 90%;
            max-height: 90%;

            width: auto;
            height: auto;

            object-fit: contain;

            border-radius: 18px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.3);

            opacity: 0;
            transform: scale(0.97);

            /* Powolne, płynne przenikanie obrazów */
            transition:
                opacity 2.5s ease-in-out,
                transform 3.5s ease-in-out;
        }

        .photo.active {
            opacity: 1;
            transform: scale(1);
        }


        /* =========================
           TEKST
        ========================= */

        .message {
            width: min(700px, 90vw);

            margin-top: 25px;
            padding: 15px 25px;

            color: white;
            text-align: center;
            font-size: clamp(24px, 3.5vw, 38px);
            font-weight: bold;
            letter-spacing: 1px;
            line-height: 1.5;

            text-shadow:
                0 2px 10px rgba(120, 20, 60, 0.5);

            opacity: 0;
            transform: translateY(15px);

            transition:
                opacity 1.5s ease,
                transform 1.5s ease;
        }

        .message.show {
            opacity: 1;
            transform: translateY(0);
        }


        /* =========================
           PRZYCISK MUZYKI
        ========================= */

        .music-button {
            position: fixed;

            right: 20px;
            bottom: 20px;

            width: 50px;
            height: 50px;

            border: none;
            border-radius: 50%;

            background: rgba(255, 255, 255, 0.7);

            color: #d94d87;

            font-size: 22px;

            cursor: pointer;

            z-index: 2000;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);

            transition: 0.3s;
        }

        .music-button:hover {
            transform: scale(1.1);
            background: white;
        }


        /* =========================
           TELEFON
        ========================= */

        @media (max-width: 600px) {

            .gallery {
                height: 55vh;
            }

            .photo {
                max-width: 82%;
                max-height: 82%;
            }

            .message {
                font-size: 24px;
                margin-top: 15px;
            }
        }

    </style>
</head>


<body>


    <!-- =========================================
         MUZYKA
    ========================================== -->

    <audio id="music" loop>
        <source src="muzyka.mp4" type="audio/mpeg">
    </audio>


    <!-- =========================================
         GŁÓWNA ZAWARTOŚĆ
    ========================================== -->

    <main class="container">

        <div class="gallery">
            <!-- TUTAJ WPISZ SWOJE ZDJĘCIA -->
            <img src="1.jpg" class="photo active" alt="Zdjęcie 1">
        </div>

        <!-- STAŁY NAPIS POD GALERIĄ -->
        <div id="message" class="message">
            Kocham cię bardzo❤️😘
        </div>

    </main>


    <!-- PRZYCISK MUZYKI -->

    <button id="musicButton" class="music-button">
        🔇
    </button>


    <script>

        /* =========================================
           AUTOMATYCZNE PRZENIKANIE ZDJĘĆ
        ========================================== */

        const photos = document.querySelectorAll(".photo");
        const messageElement = document.getElementById("message");
        let current = 0;

        window.addEventListener("load", () => {
            setTimeout(() => {
                messageElement.classList.add("show");
            }, 800);
        });

        setInterval(() => {
            photos[current].classList.remove("active");

            current++;
            if (current >= photos.length) {
                current = 0;
            }

            photos[current].classList.add("active");
        }, 6000); // Zmiana zdjęcia co 6 sekund


        /* =========================================
           MUZYKA
        ========================================== */

        const music = document.getElementById("music");
        const musicButton = document.getElementById("musicButton");

        let musicStarted = false;

        function startMusic() {
            music.play()
                .then(() => {
                    musicStarted = true;
                    musicButton.textContent = "🔊";
                })
                .catch(() => {
                    musicButton.textContent = "🔇";
                });
        }

        musicButton.addEventListener("click", (event) => {
            event.stopPropagation();

            if (music.paused) {
                music.play();
                musicButton.textContent = "🔊";
            } else {
                music.pause();
                musicButton.textContent = "🔇";
            }
        });


        /* =========================================
           SERDUSZKA
        ========================================== */

        function createHeart() {
            const heart = document.createElement("div");
            heart.classList.add("heart");

            heart.style.left = Math.random() * 100 + "vw";

            const duration = Math.random() * 4 + 4;
            heart.style.animationDuration = duration + "s";

            const size = Math.random() * 40 + 20;
            heart.style.width = size + "px";
            heart.style.height = size + "px";

            heart.style.animationDelay = Math.random() * 2 + "s";

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, (duration + 2) * 1000);
        }

        setInterval(createHeart, 250);


        /* =========================================
           SERDUSZKA PO KLIKNIĘCIU
        ========================================== */

        window.addEventListener("click", (e) => {
            if (!musicStarted) {
                startMusic();
            }

            const amount = 12;

            for (let i = 0; i < amount; i++) {
                const burstHeart = document.createElement("div");
                burstHeart.classList.add("heart-burst");

                const size = Math.random() * 25 + 15;
                burstHeart.style.width = size + "px";
                burstHeart.style.height = size + "px";

                burstHeart.style.left = e.clientX - size / 2 + "px";
                burstHeart.style.top = e.clientY - size / 2 + "px";

                document.body.appendChild(burstHeart);

                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * 200 + 100;

                const x = Math.cos(angle) * velocity;
                const y = Math.sin(angle) * velocity;

                burstHeart.animate(
                    [
                        {
                            transform: "translate(0, 0) scale(1) rotate(0deg)",
                            opacity: 1
                        },
                        {
                            transform: `translate(${x}px, ${y}px) scale(0) rotate(${Math.random() * 360}deg)`,
                            opacity: 0
                        }
                    ],
                    {
                        duration: 1000,
                        easing: "ease-out"
                    }
                ).onfinish = () => {
                    burstHeart.remove();
                };
            }
        });

    </script>

</body>
</html>
